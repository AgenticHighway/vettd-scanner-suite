# Config for the Docker Compose local deployment (compose.yaml at repo root).
# This is intentionally a separate, committed file from the gitignored
# scanner-suite.toml used for bare-metal local runs — see docs/design.md
# "Local deployment (Docker Compose)".

[server]
host = "0.0.0.0"    # REQUIRED: 0.0.0.0, not the config-default 127.0.0.1 — the
                    # suite's published port must be reachable from outside
                    # its own container. See docs/design.md for the general
                    # bind-address note (also applies to the shims).
port = 8080

[jobs]
max_concurrent = 2
scanner_timeout_ms = 120000

[scanners.vettd]
enabled = true
shim_url = "http://vettd-shim:8788"    # compose service name, not localhost —
                                       # this is the seam that changes back to
                                       # 127.0.0.1 for the future single-image
                                       # bundle (co-located, shared loopback).
health_timeout_ms = 2000
scan_timeout_ms = 30000

[scanners.cisco]
enabled = true
shim_url = "http://cisco-shim:8787"    # compose service name, not localhost
health_timeout_ms = 2000
scan_timeout_ms = 30000
queue_depth = 50
